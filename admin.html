<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elite 5 Organizer View</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--red:#e10600;--blue:#0a2472;--line:#e2e6ef;--muted:#5b6472;}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#f4f6fb;color:#0c1220;padding:30px 20px}
    .wrap{max-width:1100px;margin:0 auto}
    .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:22px}
    h1{font-family:'Anton',sans-serif;color:var(--blue);letter-spacing:1px}
    .count{background:var(--red);color:#fff;padding:6px 14px;border-radius:999px;font-weight:800}
    .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
    .btn{border:none;cursor:pointer;font-weight:800;padding:11px 20px;border-radius:10px;font-size:.95rem}
    .btn-red{background:var(--red);color:#fff}
    .btn-blue{background:var(--blue);color:#fff}
    .btn-ghost{background:#fff;border:1.5px solid var(--line)}
    .empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:60px 20px;text-align:center;color:var(--muted)}
    .team{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 8px 24px rgba(10,36,114,.08)}
    .team-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:16px}
    .team-name{font-family:'Anton',sans-serif;font-size:1.5rem;color:var(--blue)}
    .team-meta{color:var(--muted);font-size:.9rem}
    .team-jersey{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;margin:4px 0}
    .jersey-dot{width:16px;height:16px;border:2px solid var(--blue);display:inline-block;flex-shrink:0}
    .contact{background:#fff6f5;border:1px solid #ffdad7;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:.95rem}
    .contact strong{color:var(--red)}
    .players{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
    .pcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fbfcff}
    .pcard img{width:100%;height:150px;object-fit:cover;display:block;background:#eef}
    .pcard .noimg{width:100%;height:150px;display:grid;place-items:center;color:var(--muted);background:#eef}
    .pinfo{padding:10px 12px}
    .pinfo .pn{font-weight:800}
    .pinfo .pd{color:var(--muted);font-size:.85rem}
    .pinfo a{color:var(--blue);font-size:.85rem;font-weight:700}
    .cap{display:inline-block;background:var(--red);color:#fff;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:999px;margin-top:6px}
    .note{color:var(--muted);font-size:.85rem;margin-top:8px}
    a.back{color:var(--blue);font-weight:700;text-decoration:none}
    .btn-green{background:#16a34a;color:#fff}
    .results{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 8px 24px rgba(10,36,114,.08)}
    .rtitle{font-family:'Anton',sans-serif;color:var(--blue);font-size:1.3rem;margin-bottom:14px;letter-spacing:.5px}
    .rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
    .rgrid label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
    .rgrid select,.rgrid input{padding:10px;border:1.5px solid var(--line);border-radius:8px;font-size:.95rem;font-family:inherit;background:#fff}
    .winners{margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
    .wchip{border-radius:10px;padding:9px 14px;font-weight:700;font-size:.95rem;background:#eef1fb;border:1px solid #c7cde0}
    .wchip.champ{background:#fff7e6;border-color:#f5c518}
    .placement{display:inline-block;font-size:.68rem;font-weight:800;padding:3px 10px;border-radius:999px;margin-left:10px;vertical-align:middle}
    .placement.champ{background:#f5c518;color:#3a2e00}
    .placement.run{background:#c7cde0;color:#1a2036}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Elite 5 Registrations</h1>
        <a class="back" href="index.html">← Back to site</a>
      </div>
      <span class="count" id="count">0 teams</span>
    </div>

    <div class="bar">
      <button class="btn btn-green" id="export-csv">Download Excel (CSV)</button>
      <button class="btn btn-blue" id="export">Export JSON (backup)</button>
      <button class="btn btn-ghost" id="refresh">Refresh</button>
      <button class="btn btn-red" id="clear">Clear all</button>
    </div>

    <div class="results" id="results">
      <div class="rtitle">Results &amp; Winners</div>
      <div class="rgrid">
        <label>Champion<select id="r-champion"></select></label>
        <label>Runner-up<select id="r-runner"></select></label>
        <label>Top scorer / MVP<input id="r-scorer" type="text" placeholder="Player name (optional)" /></label>
      </div>
      <button class="btn btn-blue" id="save-results">Save results</button>
      <div class="winners" id="winners-banner"></div>
    </div>

    <p class="note">Note: registrations and results are stored in <strong>this browser only</strong> (localStorage). To collect entries from teams on their own devices, connect the form to a backend. See <strong>README.md</strong> for setup.</p>

    <div id="list"></div>
  </div>

  <script>
    const KEY = 'elite5_registrations';
    const list = document.getElementById('list');
    const count = document.getElementById('count');

    function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return []; } }

    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function igUrl(h){ const u=String(h||'').replace(/^@/,'').trim(); return u?'https://instagram.com/'+encodeURIComponent(u):''; }
    const JCOL={Red:'#e11d2a',Blue:'#1e5cff',Green:'#16a34a',Yellow:'#f5c518',Orange:'#f97316',Purple:'#7c3aed',Black:'#111111',White:'#ffffff'};

    function render(){
      const data = load();
      const res = loadResults();
      count.textContent = data.length + (data.length===1?' team':' teams');
      if(!data.length){ list.innerHTML='<div class="empty">No registrations yet. Entries submitted on this device will appear here.</div>'; return; }
      list.innerHTML = data.map(r=>{
        const placement = res.champion===r.id?'<span class="placement champ">CHAMPION</span>':(res.runnerUp===r.id?'<span class="placement run">RUNNER-UP</span>':'');
        return `
        <div class="team">
          <div class="team-head">
            <div>
              <div class="team-name">${esc(r.team && r.team.name)}${placement}</div>
              ${r.team&&r.team.jerseyColor?`<div class="team-jersey"><span class="jersey-dot" style="background:${JCOL[r.team.jerseyColor]||'#ccc'}"></span>${esc(r.team.jerseyColor)} jersey</div>`:''}
              <div class="team-meta">${esc(r.id)} · ${new Date(r.submittedAt).toLocaleString()}</div>
            </div>
          </div>
          <div class="contact">
            <strong>Captain contact:</strong> ${esc(r.captainContact.name)} ·
            📞 ${esc(r.captainContact.phone)} ·
            ✉ <a href="mailto:${esc(r.captainContact.email)}">${esc(r.captainContact.email)}</a>
          </div>
          <div class="players">
            ${r.players.map(p=>`
              <div class="pcard">
                ${p.photo?`<img src="${p.photo}" alt="${esc(p.name)}">`:'<div class="noimg">No photo</div>'}
                <div class="pinfo">
                  <div class="pn">${esc(p.name)}</div>
                  <div class="pd">DOB: ${esc(p.dob)}</div>
                  ${igUrl(p.instagram)?`<a href="${igUrl(p.instagram)}" target="_blank" rel="noopener">${esc(p.instagram)}</a>`:'<span class="pd" style="opacity:.5">No Instagram</span>'}
                  ${p.isCaptain?'<div><span class="cap">⭐ CAPTAIN</span></div>':''}
                </div>
              </div>`).join('')}
          </div>
        </div>`;
      }).join('');
    }

    /* ---- Results / winners ---- */
    const RKEY='elite5_results';
    function loadResults(){ try{ return JSON.parse(localStorage.getItem(RKEY)||'{}'); }catch(e){ return {}; } }
    function saveResults(r){ localStorage.setItem(RKEY, JSON.stringify(r)); }
    function teamName(id){ const t=load().find(x=>x.id===id); return t&&t.team?t.team.name:''; }

    function renderResults(){
      const data=load(), res=loadResults();
      const opts='<option value="">— none —</option>'+data.map(r=>`<option value="${esc(r.id)}">${esc(r.team&&r.team.name)}</option>`).join('');
      const ch=document.getElementById('r-champion'), ru=document.getElementById('r-runner'), sc=document.getElementById('r-scorer');
      ch.innerHTML=opts; ru.innerHTML=opts;
      ch.value=res.champion||''; ru.value=res.runnerUp||''; sc.value=res.topScorer||'';
      renderWinners();
    }
    function renderWinners(){
      const res=loadResults(); let h='';
      if(res.champion) h+=`<div class="wchip champ">🏆 Champion: <b>${esc(teamName(res.champion))}</b></div>`;
      if(res.runnerUp) h+=`<div class="wchip">Runner-up: <b>${esc(teamName(res.runnerUp))}</b></div>`;
      if(res.topScorer) h+=`<div class="wchip">Top scorer / MVP: <b>${esc(res.topScorer)}</b></div>`;
      document.getElementById('winners-banner').innerHTML=h;
    }
    document.getElementById('save-results').addEventListener('click', ()=>{
      const champion=document.getElementById('r-champion').value;
      const runnerUp=document.getElementById('r-runner').value;
      if(champion && champion===runnerUp){ alert('Champion and runner-up must be different teams.'); return; }
      saveResults({ champion, runnerUp, topScorer:document.getElementById('r-scorer').value.trim() });
      renderResults(); render();
    });

    /* ---- Excel (CSV) export ---- */
    function csvCell(v){ v=String(v==null?'':v); return /[",\r\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
    function exportCSV(){
      const data=load(), res=loadResults();
      if(!data.length){ alert('No registrations to export yet.'); return; }
      const headers=['Team','Jersey Color','Placement','Registered At','Captain Contact','Captain Phone','Captain Email','Player Name','Player DOB','Player Instagram','Team Captain'];
      const rows=[headers];
      data.forEach(r=>{
        const placement=res.champion===r.id?'Champion':(res.runnerUp===r.id?'Runner-up':'');
        (r.players||[]).forEach(p=>{
          rows.push([ r.team&&r.team.name, r.team&&r.team.jerseyColor, placement, new Date(r.submittedAt).toLocaleString(),
            r.captainContact.name, r.captainContact.phone, r.captainContact.email,
            p.name, p.dob, p.instagram, p.isCaptain?'Yes':'No' ]);
        });
      });
      const csv='﻿'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');
      const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download='elite5_teams.csv'; a.click(); URL.revokeObjectURL(a.href);
    }
    document.getElementById('export-csv').addEventListener('click', exportCSV);

    document.getElementById('refresh').addEventListener('click', ()=>{ renderResults(); render(); });
    document.getElementById('export').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify({registrations:load(),results:loadResults()},null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download='elite5_registrations.json'; a.click(); URL.revokeObjectURL(a.href);
    });
    document.getElementById('clear').addEventListener('click', ()=>{
      if(confirm('Delete ALL registrations AND results stored in this browser? This cannot be undone.')){
        localStorage.removeItem(KEY); localStorage.removeItem(RKEY); renderResults(); render();
      }
    });
    renderResults();
    render();
  </script>
</body>
</html>
